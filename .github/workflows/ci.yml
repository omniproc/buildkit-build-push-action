# Runs the action in dryrun mode inside the act-buildkit-runner container
# to verify the CLI flag assembly and option handling without a real buildkitd.
# A successful run on main gates the Release workflow.
name: CI
run-name: CI / ${{ github.event_name }}

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

# Cancel older runs for the same branch/PR to save runner minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Exercises all core inputs (tags, addr, output, secrets, allow, ssh)
  # in dryrun mode to verify the buildctl command is assembled correctly.
  test-dryrun:
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/omniproc/act-buildkit-runner:0.28.1
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: OCI metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,event=branch
            type=raw,value=latest

      - name: Test action (dryrun)
        uses: ./
        with:
          dryrun: 'true'
          tags: ${{ steps.meta.outputs.tags }}
          addr: 'tcp://buildkitd:1234'
          output: 'type=image,push=false'
          log-format: 'text'
          no-cache: 'true'
          secret: |
            id=mysecret,src=/dev/null
          allow: |
            network.host
          ssh: |
            default

  # Exercises cache-related inputs (export-cache, import-cache) in dryrun
  # mode to verify they are correctly wired into the buildctl command.
  test-with-cache:
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/omniproc/act-buildkit-runner:0.28.1
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: OCI metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,event=branch
            type=raw,value=latest

      - name: Test action with cache options (dryrun)
        uses: ./
        with:
          dryrun: 'true'
          tags: ${{ steps.meta.outputs.tags }}
          addr: 'tcp://buildkitd:1234'
          output: 'type=image,push=false'
          export-cache: 'type=registry,ref=ghcr.io/${{ github.repository }}:buildcache,mode=max,push=true'
          import-cache: 'type=registry,ref=ghcr.io/${{ github.repository }}:buildcache'