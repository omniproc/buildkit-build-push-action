name: Release Please

on:
  workflow_run:
    workflows: ["Tests"]
    types:
      - completed
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          release-type: node
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}

      - name: Update major version tag
        if: ${{ steps.release.outputs.release_created }}
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          MAJOR: ${{ steps.release.outputs.major }}
          SHA: ${{ steps.release.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          
          # Check if tag exists and update or create accordingly
          if gh api "repos/${{ github.repository }}/git/refs/tags/v${MAJOR}" &>/dev/null; then
            echo "Updating existing v${MAJOR} tag to ${SHA}"
            gh api "repos/${{ github.repository }}/git/refs/tags/v${MAJOR}" \
              -X PATCH -f sha="${SHA}" --silent
          else
            echo "Creating new v${MAJOR} tag at ${SHA}"
            gh api "repos/${{ github.repository }}/git/refs" \
              -X POST -f ref="refs/tags/v${MAJOR}" -f sha="${SHA}" --silent
          fi
          echo "Tag v${MAJOR} now points to ${SHA}"
