name: Release
run-name: Release

on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release-please:
    runs-on: ubuntu-24.04
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Generate App token
        uses: actions/create-github-app-token@v3
        id: app-token
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
      - name: Run release-please
        uses: googleapis/release-please-action@v4
        id: release
        with:
          release-type: node
          token: ${{ steps.app-token.outputs.token }}

      - name: Update major version tag
        if: ${{ steps.release.outputs.release_created }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          MAJOR: ${{ steps.release.outputs.major }}
          SHA: ${{ steps.release.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          
          # Check if tag exists (use singular /ref/ for exact match, not /refs/ which does prefix matching)
          if gh api "repos/${{ github.repository }}/git/ref/tags/v${MAJOR}" &>/dev/null; then
            echo "Updating existing v${MAJOR} tag to ${SHA}"
            gh api "repos/${{ github.repository }}/git/ref/tags/v${MAJOR}" \
              -X PATCH -f sha="${SHA}" --silent
          else
            echo "Creating new v${MAJOR} tag at ${SHA}"
            gh api "repos/${{ github.repository }}/git/refs" \
              -X POST -f ref="refs/tags/v${MAJOR}" -f sha="${SHA}" --silent
          fi
          echo "Tag v${MAJOR} now points to ${SHA}"
