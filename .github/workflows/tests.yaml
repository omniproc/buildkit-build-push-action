name: Tests
on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test-dryrun:
    runs-on: ubuntu-22.04
    container:
      image: ghcr.io/omniproc/act-buildkit-runner:0.28.1
    steps:
      - uses: actions/checkout@v6

      - name: oci metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,event=branch
            type=raw,value=latest

      - name: Test action (dryrun)
        uses: ./
        with:
          dryrun: 'true'
          tags: ${{ steps.meta.outputs.tags }}
          addr: 'tcp://buildkitd:1234'
          output: 'type=image,push=false'

  test-with-cache:
    runs-on: ubuntu-22.04
    container:
      image: ghcr.io/omniproc/act-buildkit-runner:0.28.1
    steps:
      - uses: actions/checkout@v6

      - name: oci metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,event=branch
            type=raw,value=latest

      - name: Test action with cache options (dryrun)
        uses: ./
        with:
          dryrun: 'true'
          tags: ${{ steps.meta.outputs.tags }}
          addr: 'tcp://buildkitd:1234'
          output: 'type=image,push=false'
          export-cache: 'type=registry,ref=ghcr.io/${{ github.repository }}:buildcache,mode=max,push=true'
          import-cache: 'type=registry,ref=ghcr.io/${{ github.repository }}:buildcache'